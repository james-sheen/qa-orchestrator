# The suite, and then both scenarios run for real.
#
# The unit tests cover the parser, the comparator and the architectural boundary
# without a machine or a referee. That is most of the program, and none of it
# proves the thing this repository exists to do -- so the scenarios run too,
# against the audit tool installed from the index, exactly as a consumer would
# get it.
#
# The referee is pinned as a range, the way the audit tool pins its engine. Any
# 0.1.x release lands here without this repository changing, which is precisely
# the seam a scenario run is able to notice.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. `>=3.10` is a claim about five of them and exactly one was
  # ever run. In a sibling repository that gap hid two end-to-end tests that had
  # been erroring since 3.13, and every host this family is deployed on runs
  # 3.14.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ".[dev]"
          python3 -m pytest tests/ -q

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message step needs the commits in this push,
          # and the default depth of 1 would leave it checking only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, with the referee
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[referee,dev]'
          python3 -m pip show bmc-sensor-audit | sed -n 's/^Version: /  referee /p'
          python3 -m pip show arbiter-engine   | sed -n 's/^Version: /  engine  /p'

      - name: The suite
        run: python3 -m pytest tests/ -q

      - name: Every scenario parses
        # Cheap, and it catches a scenario nobody runs in CI. A file that cannot
        # be parsed is a file that was never going to test anything.
        run: qa-orchestrator check scenarios/

      - name: The acceptance scenario -- the experiment the tool already ships
        # Expected to pass. If it stops passing, either the engine changed its
        # verdict on a series whose shape is fixed, or this harness stopped
        # driving it correctly -- and both are worth a red.
        run: qa-orchestrator run scenarios/stuck-at.yaml

      - name: The coverage scenario -- removed, then disabled
        run: qa-orchestrator run scenarios/sensor-removed.yaml

      - name: A scenario that should fail, does
        # The non-vacuity check. Every scenario above is expected to pass, so a
        # harness that had broken into always reporting success would sail
        # through all of them. This one plants an expectation that is wrong on
        # purpose and asserts the run refuses it, with exit 1 and not exit 2 --
        # a disagreement, not a harness that fell over.
        run: |
          set -euo pipefail
          sed 's/exit: 0/exit: 1/' scenarios/sensor-removed.yaml > /tmp/wrong.yaml
          set +e
          qa-orchestrator run /tmp/wrong.yaml > /tmp/wrong.log 2>&1
          code=$?
          set -e
          echo "  exited ${code}"
          test "${code}" -eq 1 || {
            echo "expected 1 (a verdict disagreed); got ${code}"; cat /tmp/wrong.log; exit 1; }
          grep -q "mismatch" /tmp/wrong.log

      - name: The testbed tier still refuses
        # It has no hardware behind it. The day this stops raising is the day a
        # scenario can claim it pulled a real fan while touching nothing.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from qa_orchestrator.backends import BackendUnavailable, build
          try:
              build("testbed", {})
          except BackendUnavailable as refusal:
              assert "not implemented" in str(refusal)
              print("  testbed refuses, as it must")
          else:
              raise SystemExit("the testbed backend constructed without a lab behind it")
          PY

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED
