# The suite, and then the example vertical run for real.
#
# The unit tests cover the parser, the comparator, the registries and the
# architectural boundary without a substrate or a referee. That is most of the
# program, and none of it proves the thing this repository exists to do -- so the
# example runs too, through the INSTALLED command rather than the tree, which is
# how a consumer reaches it and the only way a packaging fault shows up.
#
# The first vertical's scenarios run here too, from inside the vertical they
# belong to. They are `qa-scenario/1` files read unchanged through the aliases,
# so this step is also the only place the v1 compatibility claim is exercised
# end to end rather than at the parser.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. `>=3.10` is a claim about five of them and exactly one was
  # ever run. In a sibling repository that gap hid two end-to-end tests that had
  # been erroring since 3.13, and every host this family is deployed on runs
  # 3.14.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ".[dev]"
          python3 -m pytest tests/ -q

  checks:
    runs-on: ubuntu-latest
    env:
      # One place. Written into each step instead, it would be five things to
      # change the next time the first vertical's files move -- which they just
      # did, out of the core and into the vertical that gives them meaning.
      BMC_SCENARIOS: src/qa_orchestrator/verticals/bmc_scenarios
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message step needs the commits in this push,
          # and the default depth of 1 would leave it checking only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, with the first vertical's referee
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[bmc,dev]'
          python3 -m pip show bmc-sensor-audit | sed -n 's/^Version: /  referee /p'
          python3 -m pip show arbiter-engine   | sed -n 's/^Version: /  engine  /p'

      - name: The suite
        run: python3 -m pytest tests/ -q

      - name: What this build can name
        # Cheap, and it is the only step that fails when the entry point breaks.
        # A vertical that stops loading leaves every scenario naming it refused,
        # which reads like a bad scenario rather than a bad install.
        run: |
          set -euo pipefail
          qa-orchestrator list
          qa-orchestrator list | grep -q "bmc-sensor-audit" || {
            echo "the shipped vertical did not register through its entry point"
            exit 1; }

      - name: The first vertical's scenarios parse
        # Cheap, and it catches a scenario nobody runs in CI. A file that cannot
        # be parsed is a file that was never going to test anything. It also
        # proves the tiers reached the registry: every one of these names `mock`.
        run: qa-orchestrator check "${BMC_SCENARIOS}"

      # Running those scenarios is NOT a step here. `tests/test_bmc_scenarios_run.py`
      # does it, parametrised over whatever the directory holds, through the same
      # console script -- and because this job installs the `bmc` extra, the suite
      # step above runs them. Two named steps doing what one test does is two
      # things to update when a scenario is added, and the one that gets forgotten
      # is the one nobody notices is missing.

      - name: The lab tier still refuses
        # It has no hardware behind it. The suite pins this too; here it runs
        # against the INSTALLED package, reached the way a consumer reaches it.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from qa_orchestrator import substrate
          from qa_orchestrator.verticals import bmc
          bmc.register()
          try:
              substrate.build("testbed", {})
          except Exception as refusal:
              assert "not implemented" in str(refusal), refusal
              print("  the lab tier refuses, as it must")
          else:
              raise SystemExit("the lab tier constructed without a lab behind it")
          PY

      - name: The example vertical, through the installed command
        # A vertical sharing no vocabulary with the first one: a proposal, graded
        # by a checker that has never seen a BMC. The suite runs this from the
        # tree; here it goes through the console script, against the package as
        # installed, which is the half a `src/` layout exists to keep honest.
        run: |
          set -euo pipefail
          PATH="${PWD}/examples/paper/bin:${PATH}"
          export PATH
          qa-orchestrator --plugin examples/paper/vertical.py \
            run examples/paper/withdrawn.yaml

      - name: A scenario that should fail, does
        # The non-vacuity check. Everything above is expected to pass, so a
        # harness that had broken into always reporting success would sail
        # through all of it. This plants an expectation that is wrong on purpose
        # and asserts the run refuses it, with exit 1 and not exit 2 -- a
        # disagreement, not a harness that fell over.
        #
        # The exit code is not enough on its own: a missing plugin and a bad
        # argument also exit 1, and the test that pins this in the suite passed
        # on exactly that before it also required the mismatch to be reported.
        run: |
          set -euo pipefail
          PATH="${PWD}/examples/paper/bin:${PATH}"
          export PATH
          sed 's/exit: 0/exit: 1/' examples/paper/withdrawn.yaml > /tmp/wrong.yaml
          code=0
          qa-orchestrator --plugin examples/paper/vertical.py \
            run /tmp/wrong.yaml > /tmp/wrong.log 2>&1 || code=$?
          echo "  exited ${code}"
          test "${code}" -eq 1 || {
            echo "expected 1 (a verdict disagreed); got ${code}"; cat /tmp/wrong.log; exit 1; }
          grep -q "MISMATCH" /tmp/wrong.log || {
            echo "exit 1 with no mismatch reported: it failed before comparing"
            cat /tmp/wrong.log; exit 1; }

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED
